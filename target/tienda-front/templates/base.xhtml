<!DOCTYPE html>
<html lang="es"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:jsf="jakarta.faces.passthrough"
        xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="#{titulo} - Tu mayorista online. Abarrotes, bebidas, limpieza y mas al mejor precio."/>
    <title><ui:insert name="title">#{titulo}</ui:insert></title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

    <h:outputStylesheet library="css" name="base.css"/>
    <h:outputStylesheet library="css" name="layout.css"/>
    <h:outputStylesheet library="css" name="components.css"/>
    <h:outputStylesheet library="css" name="home.css"/>
    <h:outputStylesheet library="css" name="modern.css"/>

    <ui:insert name="head"/>
</h:head>
<h:body>
    <ui:include src="/includes/topbar.xhtml"/> <!-- Topbar -->
    <ui:include src="/includes/header.xhtml"/> <!-- Header -->
    <ui:include src="/includes/navbar.xhtml"/> <!-- Menu -->

    <main class="main">
        <ui:insert name="content"/> <!-- Contenido -->
    </main>

    <ui:include src="/includes/footer.xhtml"/>
    <ui:include src="/includes/delivery-modal.xhtml"/>

    <h:outputScript library="js" name="app.js" target="body"/>
</h:body>
</html>
