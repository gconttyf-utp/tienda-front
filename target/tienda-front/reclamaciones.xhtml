<!DOCTYPE html>
<ui:composition template="/templates/base.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">
    <ui:define name="title">Libro de reclamaciones - #{titulo}</ui:define>
    <ui:define name="content">
        <section class="section container static-page">
            <h1 class="page-title">Libro de reclamaciones</h1>
            <p class="page-lead">Conforme a la normativa peruana de proteccion al consumidor.</p>
            <form class="admin-form" onsubmit="alert('Reclamo registrado (demo)'); return false;">
                <div class="admin-grid-2">
                    <label class="field"><span>Nombre completo</span><input type="text" required="required"/></label>
                    <label class="field"><span>DNI</span><input type="text" required="required"/></label>
                    <label class="field"><span>Telefono</span><input type="text"/></label>
                    <label class="field"><span>Correo</span><input type="email" required="required"/></label>
                </div>
                <label class="field"><span>Detalle del reclamo</span>
                    <textarea rows="5" required="required" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px"></textarea>
                </label>
                <button type="submit" class="btn btn--primary btn--lg">Enviar reclamo</button>
            </form>
        </section>
    </ui:define>
</ui:composition>
