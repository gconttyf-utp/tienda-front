<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:jsf="jakarta.faces.passthrough"
                xmlns:ui="jakarta.faces.facelets">
    <header class="header">
        <div class="container header__inner">
            <a class="header__logo" href="#{request.contextPath}/index.jsf">
                <span class="header__logo-badge">V</span>
                <span class="header__logo-text"><strong>#{titulo}</strong></span>
            </a>

            <button type="button" class="header__location" data-open-modal="delivery">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
                </svg>
                <span class="header__location-text">
                    <small>Recojo en</small>
                    <strong>#{deliveryBean.resumenUbicacion}</strong>
                </span>
                <svg class="icon icon--chevron" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </button>

            <form class="header__search" action="#{request.contextPath}/catalogo.xhtml" method="get">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12A6 6 0 0 1 10 4z"/>
                </svg>
                <input type="text" name="q" class="header__search-input" placeholder="Que estas buscando hoy?" autocomplete="off"/>
                <button type="submit" class="btn btn--primary header__search-btn">Buscar</button>
            </form>

            <div class="header__actions">
                <a class="header__action" href="#{empty loginBean.tokenCliente ? request.contextPath += '/login.jsf' : '#'}">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/>
                    </svg>
                    <span class="header__action-text">
                        <small>Hola,</small>
                        <strong>#{not empty loginBean.tokenCliente ? 'Cliente Logueado' : 'Ingresar'}</strong>
                    </span>
                </a>
                <a class="header__action header__cart" href="#{request.contextPath}/carrito.jsf">
                    <span class="header__cart-icon">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 4H4v2h2l3.6 8.6-1.4 2.5c-.1.3-.2.6-.2.9 0 1.1.9 2 2 2h11v-2H10.4c-.1 0-.2-.1-.2-.2l.9-1.7h7.5c.7 0 1.4-.4 1.7-1l3.3-6c.1-.2.2-.5.2-.8 0-.5-.5-1-1-1H7.9l-.9-2zm3 14a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
                        </svg>
                        <span class="header__cart-badge">#{carritoBean.totalItems}</span>
                    </span>
                    <span class="header__action-text">
                        <small>Mi carrito</small>
                        <strong>S/ <h:outputText value="#{carritoBean.total}">
                            <f:convertNumber pattern="#,##0.00"/>
                        </h:outputText></strong>
                    </span>
                </a>
            </div>
        </div>
    </header>
</ui:composition>
