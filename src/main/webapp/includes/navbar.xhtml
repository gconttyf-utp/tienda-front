<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:jsf="jakarta.faces.passthrough"
                xmlns:ui="jakarta.faces.facelets">
    <nav class="navbar">
        <div class="container navbar__inner">

            <div class="mega">
                <button type="button" class="mega__trigger">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/>
                    </svg>
                    <span>Todas las categorias</span>
                </button>

                <div class="mega__panel">
                    <ul class="mega__deps">
                        
                            <ui:repeat value="#{publicoBean.departamentos}" var="d">
                                <li class="mega__dep">
                                    <a class="mega__dep-link"
                                       href="#{request.contextPath}/catalogo.jsf?dep=#{d.id}">
                                        <span class="mega__dep-name">#{d.nombre}</span>
                                        <svg class="mega__arrow" viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M9 6l6 6-6 6"/>
                                        </svg>
                                    </a>
                                    <div class="mega__flyout">
                                        <h4 class="mega__flyout-title">#{d.nombre}</h4>
                                        <a class="mega__flyout-all"
                                           href="#{request.contextPath}/catalogo.jsf?dep=#{d.id}">Ver todo</a>
                                        <ul class="mega__groups">
                                            <ui:repeat value="#{publicoBean.getGrupos(d.id)}" var="g">
                                                <li>
                                                    <a href="#{request.contextPath}/catalogo.jsf?dep=#{d.id}&amp;grupo=#{g.id}">#{g.nombre}</a>
                                                </li>
                                            </ui:repeat>
                                        </ul>
                                    </div>
                                </li>
                            </ui:repeat>
                        
                    </ul>
                </div>
            </div>

            <ul class="navbar__quick">
                <ui:fragment rendered="#{empty loginBean.tokenCliente}">
                    <ui:repeat value="#{publicoBean.departamentos}" var="c" varStatus="st" size="8">
                        <li>
                            <a href="#{request.contextPath}/catalogo.jsf?dep=#{c.id}">#{c.nombre}</a>
                        </li>
                    </ui:repeat>
                </ui:fragment>
                        
                <ui:fragment rendered="#{not empty loginBean.tokenCliente}">
                    <li><h:link outcome="index.xhtml" value="Inicio" /></li>
                    <li><h:link outcome="carrito.xhtml" value="Carrito" /></li>
                    <li><h:link outcome="pendientepago.xhtml" value="Pendiente Pago" /></li>
                    <li><h:link outcome="seguimiento.xhtml" value="Seguimiento de Pedidos" /></li>
                    <li><h:link outcome="reclamos.xhtml" value="Reclamos" /></li>
                    <li>
                        <h:form style="display:inline; margin:0; padding:0;">
                            <h:commandLink action="#{loginBean.cerrarSesionCliente}" value="Salir" style="color: #dc3545; font-weight: bold;" />
                        </h:form>
                    </li>
                </ui:fragment>
            </ul>

            <a class="navbar__offers" href="#{request.contextPath}/catalogo.jsf?ofertas=1">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.5 11l-8.5-8.5a1.4 1.4 0 0 0-1-.4H4a2 2 0 0 0-2 2v7.1c0 .4.1.7.4 1L11 20.6a1.4 1.4 0 0 0 2 0l7.5-7.5a1.4 1.4 0 0 0 0-2zM6.5 8a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
                </svg>
                Ofertas del dia
            </a>
        </div>
    </nav>
</ui:composition>
