<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:jsf="jakarta.faces.passthrough"
                xmlns:ui="jakarta.faces.facelets">
    <div class="modal" id="modal-delivery" role="dialog" aria-modal="true" aria-labelledby="modal-delivery-title" hidden="hidden">
        <div class="modal__backdrop" data-close-modal="delivery"></div>
        <div class="modal__dialog">
            <div class="modal__header">
                <h3 id="modal-delivery-title">Elige tu tienda de recojo</h3>
                <button type="button" class="modal__close" data-close-modal="delivery" aria-label="Cerrar">&#215;</button>
            </div>

            <div class="modal__pane is-active" data-pane="tienda">
                <h:form styleClass="modal__form">
                    <p class="text-soft modal__hint">Recogeras tu pedido gratis en cualquiera de nuestras tiendas VegaMarket.</p>

                    <h:selectOneRadio value="#{deliveryBean.tiendaId}" styleClass="radios-jsf-ocultos" style="display: none;">
                        <f:selectItems value="#{deliveryBean.tiendas}" var="t" itemValue="#{t.id}" />
                    </h:selectOneRadio>

                    <ul class="tienda-list">
                        <ui:repeat value="#{deliveryBean.tiendas}" var="t">
                            <li class="tienda-item">
                                <label>
                                    <input type="radio" 
                                            name="grupoTiendaVisual" 
                                            value="#{t.id}"
                                            onchange="sincronizarConJsf(this.value);"                            
                                            checked="#{t.id eq deliveryBean.tiendaId ? 'checked' : null}" />
                                            
                                    <div class="tienda-item__media">
                                        <ui:fragment rendered="#{not empty t.imagenUrl}">
                                            <h:graphicImage value="/media/tiendas/#{t.imagenUrl}" alt="#{t.nombre}" styleClass="tienda-item__thumb" jsf:loading="lazy"/>
                                        </ui:fragment>
                                        <ui:fragment rendered="#{empty t.imagenUrl}">
                                            <span class="tienda-item__thumb tienda-item__thumb--ph">V</span>
                                        </ui:fragment>
                                    </div>
                                    <div class="tienda-info">
                                        <strong>#{t.nombre}</strong>
                                        <span>#{t.direccion}<ui:fragment rendered="#{not empty t.nombreUbigeo}">, #{t.nombreUbigeo}</ui:fragment></span>
                                        <small>#{t.horario}</small>
                                    </div>
                                </label>
                            </li>
                        </ui:repeat>
                    </ul>

                    <div class="modal__actions">
                        <button type="button" class="btn btn--ghost" data-close-modal="delivery">Cancelar</button>
                        <h:commandButton value="Confirmar tienda" styleClass="btn btn--primary" action="#{deliveryBean.confirmarTienda}"/>
                    </div>

                    <script type="text/javascript">
                        function sincronizarConJsf(valorSeleccionado) {
                            // Busca todos los inputs tipo radio que generó JSF dentro de nuestra clase oculta
                            let radiosJsf = document.querySelectorAll('.radios-jsf-ocultos input[type="radio"]');
                            
                            // Recorremos los radios de JSF y marcamos el que coincide con tu clic visual
                            radiosJsf.forEach(function(radio) {
                                if (radio.value === valorSeleccionado) {
                                    radio.checked = true;
                                    console.log("Sincronizado con éxito en JSF el ID: " + valorSeleccionado);
                                }
                            });
                        }
                    </script>

                </h:form>
            </div>
        </div>
    </div>
</ui:composition>
