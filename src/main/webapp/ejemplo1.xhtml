<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Departamentos - Tienda Vega</title>
</h:head>
<h:body>
    <h2>Catálogo de Departamentos</h2>

    <h:dataTable value="#{publicoBean.departamentos}" var="dep" border="1" cellpadding="5">
        
        <h:column>
            <f:facet name="header">Código</f:facet>
            <h:outputText value="#{dep.id}" />
        </h:column>

        <h:column>
            <f:facet name="header">Nombre del Departamento</f:facet>
            <h:outputText value="#{dep.nombre}" />
        </h:column>

        <h:column>
            <f:facet name="header">Estado</f:facet>
            <h:outputText value="#{dep.estado == 1 ? 'Activo' : 'Inactivo'}" />
        </h:column>

    </h:dataTable>

</h:body>
</html>
