<!DOCTYPE html>
<ui:composition template="/templates/base.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:jsf="jakarta.faces.passthrough"
                xmlns:ui="jakarta.faces.facelets">
    <ui:define name="title">Mi carrito - #{titulo}</ui:define>
    <ui:define name="content">
        <ui:fragment rendered="#{empty loginBean.tokenCliente}">
            <div class="container section" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center;">
                <h2 style="margin-bottom: 20px;">Necesitas iniciar sesión para continuar</h2>
                <h:link outcome="login.xhtml" value="Hacer Login" styleClass="btn btn--primary btn--lg" />
            </div>
        </ui:fragment>
        <ui:fragment rendered="#{not empty loginBean.tokenCliente}">
            
        </ui:fragment>
    </ui:define>
</ui:composition>
