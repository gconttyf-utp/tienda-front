<!DOCTYPE html>
<ui:composition template="/templates/base.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Nuestras tiendas - #{titulo}</ui:define>

    <ui:define name="content">
        <section class="section container">
            <header class="page-header">
                <h1 class="page-title">Nuestras tiendas</h1>
                <p class="page-lead">
                    Recoge tu pedido gratis en cualquiera de nuestras
                    <strong>#{deliveryBean.tiendas.size()}</strong> tiendas #{titulo} en Lima.
                </p>
            </header>

            <div class="tiendas-grid">
                <ui:repeat value="#{deliveryBean.tiendas}" var="t">
                    <article class="tienda-card">
                        <div class="tienda-card__media">
                            <ui:fragment rendered="#{not empty t.imagenUrl}">
                                <img src="#{request.contextPath}/resources/images/productos/#{t.imagenUrl}"
                                     alt="#{t.nombre}" class="tienda-card__image" loading="lazy"/>
                            </ui:fragment>
                            <ui:fragment rendered="#{empty t.imagenUrl}">
                                <span class="tienda-card__placeholder">V</span>
                            </ui:fragment>
                        </div>
                        <div class="tienda-card__body">
                            <h3 class="tienda-card__name">#{t.nombre}</h3>
                            <p class="tienda-card__addr">
                                #{t.direccion}<ui:fragment rendered="#{not empty t.nombreUbigeo}">, #{t.nombreUbigeo}</ui:fragment>
                            </p>
                            <p class="tienda-card__meta">
                                <span>📍 #{t.nombreUbigeo}</span>
                                <span>🕐 #{t.horario}</span>
                                <ui:fragment rendered="#{not empty t.telefono}">
                                    <span>📞 #{t.telefono}</span>
                                </ui:fragment>
                            </p>
                        </div>
                    </article>
                </ui:repeat>
            </div>
        </section>
    </ui:define>
</ui:composition>
