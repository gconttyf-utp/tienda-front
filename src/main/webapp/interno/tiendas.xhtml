<!DOCTYPE html>
<ui:composition template="base.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:jsf="jakarta.faces.passthrough"
                xmlns:ui="jakarta.faces.facelets">
    
    <ui:define name="content">
        
        <h:panelGrid border="1" class="table">
            <f:facet name="header">
                <div class="d-flex justify-content-between align-items-center">
                    <h:outputText value="#{tiendaBean.titulo}" class="m-0 fs-5 fw-bold"/>
                    <h:button value="Agregar Tienda" outcome="tiendaform" class="btn btn-primary btn-sm" />
                </div>
            </f:facet>
            <h:outputText value="No existen tiendas en la base de datos!" rendered="#{empty tiendaBean.obtenerTiendas()}"
                          class="alert alert-warning"/>
            <h:dataTable var="t" value="#{tiendaBean.obtenerTiendas()}" rendered="#{not empty tiendaBean.obtenerTiendas()}" 
                        class="table table-hover table-striped">
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Id"/>
                    </f:facet>
                    <h:outputText value="#{t.id}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Nombre"/>
                    </f:facet>
                    <h:outputText value="#{t.nombre}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Dirección"/>
                    </f:facet>
                    <h:outputText value="#{t.direccion}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Ubigeo"/>
                    </f:facet>
                    <h:outputText value="#{t.codUbigeo}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Teléfono"/>
                    </f:facet>
                    <h:outputText value="#{t.telefono}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Horario"/>
                    </f:facet>
                    <h:outputText value="#{t.horario}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Latitud"/>
                    </f:facet>
                    <h:outputText value="#{t.latitud}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Longitud"/>
                    </f:facet>
                    <h:outputText value="#{t.longitud}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Estado"/>
                    </f:facet>
                    <h:outputText value="#{t.estado eq 1 ? 'Activo' : 'Inactivo'}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Editar"/>
                    </f:facet>
                    <h:link value="Editar" outcome="tiendaform" class="btn btn-sm btn-info">
                        <f:param name="id" value="#{t.id}"/>
                    </h:link>
                </h:column>
                <h:column>
                    <f:facet name="header">
                        <h:outputText value="Cambiar Estado"/>
                    </f:facet>
                    <h:form id="eliminarForm">
                        <h:commandLink value="#{t.estado eq 1 ? 'Inactivar' : 'Activar'}" action="#{tiendaBean.cambiarEstado(t)}"
                                       class="btn btn-sm #{t.estado eq 1 ? 'btn-danger' : 'btn-success'}"
                                       onclick="return confirm('esta seguro que desea cambiar el estado?')"/>
                    </h:form>
                </h:column>
            </h:dataTable>
        </h:panelGrid>            
        
    </ui:define>

</ui:composition>
