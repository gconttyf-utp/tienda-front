<!DOCTYPE html>
<html lang="es"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:jsf="jakarta.faces.passthrough"
        xmlns:ui="jakarta.faces.facelets">

    <!-- Agregamos el evento de validación aquí -->
    <f:event type="preRenderView" listener="#{loginBean.verificarSesionUsuario}" />
    
    <h:head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="description" content="#{titulo} - Tu mayorista online. Abarrotes, bebidas, limpieza y mas al mejor precio."/>
        <title>Administración - #{titulo}</title>
        <h:outputStylesheet name="css/bootstrap.min.css" />
        <ui:insert name="head" />
    </h:head>
    <h:body>
        <div class="container">
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Menú</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item">
                                <h:link outcome="dashboard.xhtml" value="Home" styleClass="nav-link active" />
                            </li>
                            <li class="nav-item">
                                <h:link outcome="tiendas.xhtml" value="Tiendas" styleClass="nav-link" />
                            </li>
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    Productos
                                </a>
                                <ul class="dropdown-menu">
                                    <li><h:link outcome="departamento.xhtml" value="Departamentos" styleClass="dropdown-item" /></li>
                                    <li><h:link outcome="grupo.xhtml" value="Grupos" styleClass="dropdown-item" /></li>
                                    <li><h:link outcome="categoria.xhtml" value="Categorias" styleClass="dropdown-item" /></li>
                                    <li><h:link outcome="marca.xhtml" value="Marcas" styleClass="dropdown-item" /></li>
                                    <li><h:link outcome="producto.xhtml" value="Productos" styleClass="dropdown-item" /></li>
                                </ul>
                            </li>
                            <li class="nav-item">
                                <h:link outcome="departamento.xhtml" value="Departamentos" styleClass="nav-link" />
                            </li>
                            <li class="nav-item">
                                <h:link outcome="grupo.xhtml" value="Grupos" styleClass="nav-link" />
                            </li>
                            <li class="nav-item">
                                <h:link outcome="categoria.xhtml" value="Categorias" styleClass="nav-link" />
                            </li>
                            <li class="nav-item">
                                <h:link outcome="marca.xhtml" value="Marcas" styleClass="nav-link" />
                            </li>
                            <li class="nav-item">
                                <h:link outcome="producto.xhtml" value="Productos" styleClass="nav-link" />
                            </li>
                            <li class="nav-item">
                                <a class="nav-link disabled" aria-disabled="true">Ventas</a>
                            </li>
                        </ul>
                        <h:form styleClass="m-0 p-0 d-flex">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <h:commandLink action="#{loginBean.cerrarSesionUsuario}" 
                                       value="Salir" 
                                       styleClass="nav-link text-danger fw-bold" />
                            </li>
                        </ul>
                        </h:form>
                    </div>
                </div>
            </nav>
            <hr/>
            <h:messages globalOnly="true" styleClass="alert" errorClass="alert alert-danger"
                    infoClass="alert alert-success"
                    warnClass="alert alert-warning" />
            <br />

            <ui:insert name="content"/>

            <hr/>
            <footer style="clear: both;">
                <h:graphicImage value="/resources/imagenes/logos/jakarta.png" alt="logo jakarta"/>
                <p>Desarrollado por Grupo 2 - 2026</p>
                <h:outputScript name="js/bootstrap.bundle.min.js"/>
                <ui:insert name="js"/>
            </footer>
        </div>
    </h:body>
</html>
