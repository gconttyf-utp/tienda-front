<!DOCTYPE html>
<ui:composition template="base.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:jsf="jakarta.faces.passthrough"
                xmlns:ui="jakarta.faces.facelets">
    
    <ui:define name="content">
        
        <f:metadata>
            <f:viewParam name="id" value="#{departamentoBean.id}"/>
        </f:metadata>

        <h:panelGrid border="1" class="table">
            <f:facet name="header">
                <h:outputText value="#{departamentoDTO.id > 0 ? 'Editar' : 'Crear'} Departamento"/>
            </f:facet>

            <h:form id="formDepartamento">
                <h:panelGrid columns="2" class="table table-hover table-striped">
                    <h:outputLabel value="Nombre" for="nombre" class="col-form-label"/>
                    <h:inputText id="nombre" value="#{departamentoDTO.nombre}" label="Nombre" class="form-control" jsf:placeholder="Tecnología"/>

                    <h:outputLabel value="Estado" for="estado" class="col-form-label"/>
                    <h:selectOneMenu id="estado" value="#{departamentoDTO.estado}" class="form-select">
                        <f:selectItem itemValue="1" itemLabel="Activo"/>
                        <f:selectItem itemValue="0" itemLabel="Inactivo"/>
                    </h:selectOneMenu>

                    <h:commandButton value="#{departamentoDTO.id>0 ? 'Guardar Cambios': 'Crear'}" action="#{departamentoBean.procesar}" class="btn btn-primary"/>
                    <h:link value="Cancelar" outcome="departamento" class="btn btn-primary"/>
                    
                    <h:inputHidden value="#{departamentoDTO.id}"/>
                    <h:outputText value="" />

                </h:panelGrid>
            </h:form>

        </h:panelGrid>            
        
    </ui:define>

</ui:composition>
